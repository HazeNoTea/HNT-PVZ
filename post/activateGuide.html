<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>帖子详情 · 植物大战僵尸</title>
    <link rel="icon" type="image/png" href="../common/logo.png" />
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #e8f0e3;
            background-image: radial-gradient(circle at 10% 20%, #d4e8ca 0%, #b8d0ac 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2d3e2a;
        }

        /* ===== 主容器 ===== */
        .app {
            max-width: 820px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(6px);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 60px rgba(40, 60, 30, 0.30);
            padding: 32px 36px 44px;
            border: 2px solid rgba(255, 255, 255, 0.50);
            transition: all 0.2s;
        }

        /* ===== 返回头部 ===== */
        .detail-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 3px dashed #8aaa7a;
        }

        .detail-header .title-area {
            flex: 1;
            min-width: 0;
        }

        .detail-header .site-title {
            font-size: 18px;
            font-weight: 700;
            color: #2d5e2a;
            letter-spacing: 0.5px;
        }
        .detail-header .site-title small {
            font-weight: 400;
            font-size: 14px;
            color: #5a7a4a;
            margin-left: 6px;
        }

        /* ===== 帖子内容 ===== */
        .post-detail {
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-detail .post-title {
            font-size: 28px;
            font-weight: 800;
            color: #1f3a1c;
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .post-detail .post-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #d4e5ca;
        }

        .post-detail .post-date {
            font-size: 15px;
            color: #5a7a4a;
            font-weight: 500;
        }

        .post-detail .post-tag {
            background: #f0f7eb;
            border-radius: 30px;
            padding: 2px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #4d7c3f;
            border: 1px solid #d4e5ca;
        }

        .post-detail .post-body {
            font-size: 17px;
            line-height: 1.8;
            color: #2d3e2a;
        }

        .post-detail .post-body p {
            margin-bottom: 14px;
        }

        .post-detail .post-body a {
            color: #4d7c3f;
            text-decoration: underline;
            font-weight: 500;
        }
        .post-detail .post-body a:hover {
            color: #3a6430;
        }

        .post-detail .post-body ul,
        .post-detail .post-body ol {
            padding-left: 24px;
            margin-bottom: 14px;
        }
        .post-detail .post-body li {
            margin-bottom: 6px;
        }

        .post-detail .post-body blockquote {
            background: #f6faf3;
            border-left: 4px solid #8aaa7a;
            padding: 12px 20px;
            border-radius: 12px;
            margin: 16px 0;
            color: #3d5a35;
        }

        .post-detail .post-body img {
            max-width: 100%;
            border-radius: 16px;
            margin: 12px 0;
            box-shadow: 0 4px 16px rgba(40, 60, 30, 0.10);
        }

        /* ===== 底部操作栏 ===== */
        .detail-footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #d4e5ca;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .detail-footer .footer-left {
            font-size: 14px;
            color: #5a7a4a;
        }

        .detail-footer .footer-left a {
            color: #4d7c3f;
            text-decoration: none;
            font-weight: 500;
        }
        .detail-footer .footer-left a:hover {
            text-decoration: underline;
        }

        .detail-footer .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f5faf2;
            border: 2px solid #b6cfaa;
            border-radius: 40px;
            padding: 8px 22px;
            font-weight: 600;
            font-size: 14px;
            color: #2d4a28;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .detail-footer .btn:hover {
            background: #e6f0df;
            border-color: #7fa86a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(60, 100, 40, 0.15);
        }

        .detail-footer .btn-primary {
            background: #4d7c3f;
            border-color: #4d7c3f;
            color: #fff;
        }
        .detail-footer .btn-primary:hover {
            background: #3a6430;
            border-color: #3a6430;
        }

        /* ===== 错误状态 ===== */
        .error-state {
            text-align: center;
            padding: 60px 20px 40px;
            color: #4a6a3a;
        }
        .error-state .big-emoji {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }
        .error-state h3 {
            font-size: 24px;
            font-weight: 600;
        }
        .error-state p {
            color: #6a8a5a;
            margin-top: 8px;
        }
        .error-state .btn {
            margin-top: 20px;
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f3a1c;
            color: #f0f7eb;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #2d5a28;
        }
        .toast.error {
            background: #7a3a3a;
        }
        .toast.info {
            background: #2d5a8a;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .app {
                padding: 20px 18px 28px;
                border-radius: 32px;
            }

            .detail-header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .detail-header .title-area {
                flex: 1 1 100%;
                order: 2;
            }

            .detail-header .site-title {
                font-size: 16px;
            }

            .post-detail .post-title {
                font-size: 22px;
            }
            .post-detail .post-body {
                font-size: 16px;
            }

            .detail-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }
            .detail-footer .btn {
                flex: 1;
                justify-content: center;
            }
        }

        @media (max-width: 420px) {
            .app {
                padding: 16px 14px 22px;
                border-radius: 24px;
            }
            .post-detail .post-title {
                font-size: 19px;
            }
            .post-detail .post-body {
                font-size: 15px;
            }
            .detail-footer .btn {
                font-size: 13px;
                padding: 6px 16px;
            }
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f7eb;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b6cfaa;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8aaa7a;
        }
    </style>
</head>
<body>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 主容器 ===== -->
    <div class="app" id="app">

        <!-- 头部 -->
        <div class="detail-header">
            <div class="title-area">
                <div class="site-title">植物大战僵尸·重制版 <small>资讯详情</small></div>
            </div>
        </div>

        <!-- 帖子详情容器 -->
        <div id="postContainer">
            <!-- 由 JavaScript 动态渲染 -->
        </div>

        <!-- 底部 -->
        <div class="detail-footer" id="detailFooter">
            <div class="footer-left">
                <span id="footerInfo">📖 帖子详情</span>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. 内置数据（与图鉴页面保持一致）
        // ================================================================
        const GUIDES_DATA = [{
            id: 'guide1',
            title: '激活教程',
            date: '2026-09-20',
            content: `
                <p>之前靠玩家自发赞助属实惨淡，游戏维护需要一定成本，所以后续模式如我是僵尸，及后续更新内容，需激活才能游玩，下面是激活教程</p>
                <p><strong>一、自行到爱发电赞助，注意不要选错了：</strong></p>
                <p><strong>不要自行发电</strong>，不然无法激活，从“<strong>植物大战僵尸小小的赞助</strong>”或“<strong>植物大战僵尸大大的赞助</strong>”中
                    <strong>任选一个即可</strong>    
                </p>
                <p><strong>在购买之前，务必确认你的设备能正常游玩其它模式！</strong></p>
                <img src="image/二选一.png" width="500">
                <p><strong>二、找到并复制订单号</strong></p>
                <p><strong>订单号妥善保存，不要外传，防止被其它人使用</strong></p>
                <img src="image/订单号.png" width="500">
                <p><strong>三、扫描手环图鉴二维码，或者网址https://hazenotea.github.io/HNT-PVZ/，找到激活网站</strong></p>
                <img src="image/激活网站.png" width="500">
                <p><strong>四、输入手环上显示的设备码，和刚刚复制的订单号，获取解锁码</strong></p>
                <img src="image/解锁码.png" width="500">
                <img src="image/手环端操作.png" width="500">
            `,
                //<blockquote>
                //    <strong>开发团队寄语：</strong> 感谢玩家们多年来的支持，我们一直在努力为大家带来更好的游戏体验。
                //</blockquote>
            link: ''
        }];

        // ================================================================
        // 2. 工具函数
        // ================================================================
        function showToast(message, type = 'info', duration = 2500) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.remove('show'); }, duration);
        }

        function getPostIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || params.get('guide') || null;
        }

        // ================================================================
        // 3. 渲染帖子详情
        // ================================================================
        function renderPost(postId) {
            const container = document.getElementById('postContainer');

            // 查找帖子
            let post = null;
            if (postId) {
                post = GUIDES_DATA.find(g => g.id === postId);
            }

            // 如果没找到，尝试用第一个作为默认
            if (!post && GUIDES_DATA.length > 0) {
                post = GUIDES_DATA[0];
                // 如果 URL 有 id 但没匹配到，提示用户
                if (postId) {
                    showToast('未找到指定帖子，已显示最新资讯', 'info', 2000);
                }
            }

            if (!post) {
                container.innerHTML = `
                    <div class="error-state">
                        <span class="big-emoji">📭</span>
                        <h3>暂无资讯内容</h3>
                        <p>请稍后回来查看</p>
                        <a href="index.html" class="btn" style="display:inline-flex;align-items:center;gap:6px;background:#4d7c3f;color:#fff;padding:8px 24px;border-radius:40px;text-decoration:none;margin-top:16px;">🏠 返回首页</a>
                    </div>
                `;
                document.getElementById('footerInfo').textContent = '📭 暂无内容';
                return;
            }

            // 渲染帖子
            container.innerHTML = `
                <div class="post-detail">
                    <h1 class="post-title">${post.title}</h1>
                    <div class="post-meta">
                        <span class="post-date">📅 ${post.date}</span>
                        <span class="post-tag">📰 资讯</span>
                    </div>
                    <div class="post-body">
                        ${post.content}
                    </div>
                    ${post.link ? `
                        <div style="margin-top:24px;padding-top:20px;border-top:1px solid #d4e5ca;text-align:center;">
                            <a href="${post.link}" target="_blank" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:8px;background:#4d7c3f;color:#fff;padding:10px 32px;border-radius:40px;text-decoration:none;font-weight:600;">
                                🔗 查看链接
                            </a>
                        </div>
                    ` : ''}
                </div>
            `;

            // 更新底部信息
            document.getElementById('footerInfo').textContent = `📖 ${post.title}`;

            // 更新页面标题
            document.title = `${post.title} · HNTPVZ`;
        }

        // ================================================================
        // 4. 启动
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const postId = getPostIdFromURL();
            renderPost(postId);
            console.log('📰 帖子详情页已加载，ID:', postId || '默认');
        });
    </script>

</body>
</html>
