<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HNT植物大战僵尸</title>
    <link rel="icon" type="image/png" href="common/logo.png" />
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #e8f0e3;
            background-image: radial-gradient(circle at 10% 20%, #d4e8ca 0%, #b8d0ac 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2d3e2a;
        }

        /* ===== 主容器 ===== */
        .app {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(6px);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 60px rgba(40, 60, 30, 0.30);
            padding: 28px 32px 40px;
            border: 2px solid rgba(255, 255, 255, 0.50);
            transition: all 0.2s;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px 20px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 3px dashed #8aaa7a;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            object-fit: contain;
            vertical-align: middle;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.10));
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: #2d5e2a;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(120, 160, 80, 0.20);
        }
        .logo-text small {
            font-weight: 400;
            font-size: 16px;
            color: #5a7a4a;
            margin-left: 8px;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        /* ===== 搜索框 ===== */
        .search-box {
            display: flex;
            align-items: center;
            background: #f5faf2;
            border-radius: 40px;
            padding: 4px 4px 4px 18px;
            border: 2px solid #b6cfaa;
            transition: border 0.25s, box-shadow 0.25s;
        }
        .search-box:focus-within {
            border-color: #5f8b4b;
            box-shadow: 0 0 0 4px rgba(95, 139, 75, 0.15);
        }
        .search-box input {
            border: none;
            background: transparent;
            padding: 8px 6px;
            font-size: 15px;
            outline: none;
            min-width: 160px;
            color: #1f3a1c;
        }
        .search-box input::placeholder {
            color: #8aaa7a;
        }
        .search-box button {
            background: #4d7c3f;
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .search-box button:hover {
            background: #3a6430;
        }

        /* ===== 统计 ===== */
        .stats {
            font-size: 14px;
            color: #4a6a3a;
            background: rgba(255, 255, 255, 0.50);
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 500;
        }

        /* ===== 分类导航 ===== */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.30);
            padding: 6px;
            border-radius: 60px;
            border: 1px solid rgba(160, 190, 140, 0.30);
        }
        .tab-btn {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            background: transparent;
            color: #3d5a35;
            transition: all 0.2s;
            flex: 0 1 auto;
        }
        .tab-btn:hover {
            background: rgba(77, 124, 63, 0.08);
        }
        .tab-btn.active {
            background: #4d7c3f;
            color: #fff;
            box-shadow: 0 4px 14px rgba(77, 124, 63, 0.30);
        }
        .tab-btn .badge {
            display: inline-block;
            background: rgba(0, 0, 0, 0.10);
            border-radius: 30px;
            padding: 0 10px;
            font-size: 12px;
            margin-left: 6px;
        }
        .tab-btn.active .badge {
            background: rgba(255, 255, 255, 0.20);
        }

        /* ===== 卡片网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 6px;
        }

        /* ===== 卡片 ===== */
        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 18px 16px 20px;
            box-shadow: 0 6px 20px rgba(40, 60, 30, 0.08);
            border: 2px solid rgba(180, 210, 165, 0.40);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #7fa86a, #b6d7a0);
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 16px 40px rgba(40, 70, 30, 0.18);
            border-color: #8aaa7a;
        }
        .card:hover::after {
            opacity: 1;
        }

        .card-img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            display: block;
            margin: 0 auto 4px;
            border-radius: 12px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.06));
        }
        .card-emoji {
            font-size: 56px;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .card .name {
            font-size: 18px;
            font-weight: 700;
            color: #1f3a1c;
            margin-bottom: 4px;
        }
        .card .sub {
            font-size: 13px;
            color: #5a7a4a;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 4px;
        }
        .card .tag {
            background: #f0f7eb;
            border-radius: 30px;
            padding: 2px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #3d6335;
            border: 1px solid #d4e5ca;
        }
        .card .tag.plant-tag {
            background: #e1f0d8;
            border-color: #b6d0a6;
            color: #2d5a28;
        }
        .card .tag.zombie-tag {
            background: #efe6e6;
            border-color: #d4c4c4;
            color: #6d4a4a;
        }

        /* ===== 帖子卡片（资讯列表） ===== */
        .post-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(40, 60, 30, 0.08);
            border: 1px solid #d4e5ca;
            transition: all 0.2s;
            cursor: pointer;
        }
        .post-card:hover {
            box-shadow: 0 8px 24px rgba(40, 60, 30, 0.15);
            transform: translateY(-2px);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 10px;
        }
        .post-title {
            font-size: 20px;
            font-weight: 700;
            color: #1f3a1c;
            margin: 0;
        }
        .post-date {
            font-size: 14px;
            color: #5a7a4a;
            font-weight: 500;
        }
        .post-content {
            font-size: 15px;
            line-height: 1.6;
            color: #2d3e2a;
            margin-bottom: 12px;
        }
        .post-content a {
            color: #4d7c3f;
            text-decoration: underline;
        }
        .post-content a:hover {
            color: #3a6430;
        }
        .post-link {
            display: inline-block;
            margin-top: 6px;
            color: #4d7c3f;
            font-weight: 600;
            text-decoration: none;
        }
        .post-link:hover {
            text-decoration: underline;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 35, 15, 0.60);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            animation: fadeIn 0.25s;
        }
        .modal-overlay.open {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal {
            background: #ffffff;
            border-radius: 40px;
            max-width: 520px;
            width: 100%;
            padding: 32px 36px 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.40);
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.30);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #8aaa7a;
            transition: color 0.2s, transform 0.2s;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 30px;
        }
        .modal-close:hover {
            color: #3a5a30;
            transform: rotate(90deg);
        }

        .modal-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: block;
            margin: 0 auto 4px;
            border-radius: 16px;
        }
        .modal-emoji {
            font-size: 80px;
            text-align: center;
            display: block;
            margin-bottom: 4px;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.06));
        }

        .modal .modal-name {
            font-size: 30px;
            font-weight: 800;
            text-align: center;
            color: #1f3a1c;
        }
        .modal .modal-type {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #5a7a4a;
            margin-bottom: 16px;
            display: inline-block;
            padding: 2px 20px;
            border-radius: 30px;
            background: #f0f7eb;
            margin-left: auto;
            margin-right: auto;
        }
        .modal .modal-desc {
            font-size: 16px;
            line-height: 1.7;
            color: #2d4a28;
            background: #f6faf3;
            padding: 16px 20px;
            border-radius: 20px;
            margin: 12px 0 18px;
            border-left: 4px solid #8aaa7a;
        }
        .modal .props {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            margin-top: 8px;
        }
        .modal .prop-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #f0f5ec;
            font-size: 15px;
        }
        .modal .prop-item .label {
            color: #5a7a4a;
            font-weight: 500;
        }
        .modal .prop-item .value {
            font-weight: 700;
            color: #1f3a1c;
        }
        .modal .prop-item .value.plant-val {
            color: #3a7a2a;
        }
        .modal .prop-item .value.zombie-val {
            color: #8a4a4a;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: #5a7a4a;
            border-top: 1px solid rgba(160, 190, 140, 0.25);
            padding-top: 18px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .app {
                padding: 16px 14px 24px;
                border-radius: 32px;
            }
            .logo-text {
                font-size: 22px;
            }
            .logo-text small {
                font-size: 13px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-actions {
                flex-wrap: wrap;
                justify-content: stretch;
            }
            .header-actions .search-box {
                flex: 1;
                min-width: 140px;
            }
            .header-actions .search-box input {
                min-width: 80px;
                font-size: 14px;
            }
            .tabs {
                border-radius: 30px;
                padding: 4px;
                gap: 4px;
            }
            .tab-btn {
                padding: 8px 14px;
                font-size: 13px;
                flex: 1;
                text-align: center;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 14px;
            }
            .card .card-img {
                width: 44px;
                height: 44px;
            }
            .card .card-emoji {
                font-size: 44px;
            }
            .card .name {
                font-size: 16px;
            }
            .modal {
                padding: 24px 20px 30px;
                max-width: 100%;
                margin: 12px;
            }
            .modal .modal-img {
                width: 60px;
                height: 60px;
            }
            .modal .modal-emoji {
                font-size: 60px;
            }
            .modal .modal-name {
                font-size: 24px;
            }
            .modal .props {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .post-card {
                padding: 16px 18px;
            }
            .post-title {
                font-size: 18px;
            }
        }

        @media (max-width: 420px) {
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .card {
                padding: 12px 8px 14px;
                border-radius: 20px;
            }
            .card .card-img {
                width: 36px;
                height: 36px;
            }
            .card .card-emoji {
                font-size: 36px;
            }
            .card .name {
                font-size: 14px;
            }
            .card .sub {
                font-size: 11px;
            }
            .card .tag {
                font-size: 10px;
                padding: 1px 10px;
            }
            .tab-btn {
                font-size: 12px;
                padding: 6px 10px;
            }
            .search-box input {
                min-width: 60px;
                font-size: 13px;
            }
            .search-box button {
                padding: 6px 12px;
                font-size: 12px;
            }
            .post-card {
                padding: 14px 16px;
            }
            .post-title {
                font-size: 16px;
            }
        }

        /* ===== 滚动条美化 ===== */
        .modal::-webkit-scrollbar {
            width: 6px;
        }
        .modal::-webkit-scrollbar-track {
            background: #f0f7eb;
            border-radius: 10px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: #b6cfaa;
            border-radius: 10px;
        }
        .modal::-webkit-scrollbar-thumb:hover {
            background: #8aaa7a;
        }

        /* ===== 提示消息 ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f3a1c;
            color: #f0f7eb;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #2d5a28;
        }
        .toast.error {
            background: #7a3a3a;
        }
        .toast.info {
            background: #2d5a8a;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #4a6a3a;
        }
        .empty-state .big-emoji {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 22px;
            font-weight: 600;
        }
        .empty-state p {
            color: #6a8a5a;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- ===== 提示 Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 主应用 ===== -->
    <div class="app" id="app">

        <!-- 头部 -->
        <header class="header">
            <div class="logo-area">
                <img src="common/logo.png" alt="Logo" class="logo-icon" />
                <span class="logo-text">植物大战僵尸·重制版 <small>@HazeNoTea</small></span>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索名称..." />
                    <button id="searchBtn">🔍 查找</button>
                </div>
                <span class="stats" id="statsCounter">0 个条目</span>
            </div>
        </header>

        <!-- 分类导航 -->
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" data-filter="all">🌱 全部图鉴 <span class="badge" id="countAll">0</span></button>
            <button class="tab-btn" data-filter="plant">🌻 植物图鉴 <span class="badge" id="countPlant">0</span></button>
            <button class="tab-btn" data-filter="zombie">😅 僵尸图鉴 <span class="badge" id="countZombie">0</span></button>
            <button class="tab-btn" data-filter="guide">🖼️ 游戏资讯 <span class="badge" id="gameGuide">0</span></button>
        </div>

        <!-- 卡片网格 -->
        <div class="grid" id="gridContainer"></div>

        <!-- 底部 -->
        <div class="footer">
            <span>植物大战僵尸重制版 · 图鉴 v1.5 HazeNoTea && DeepSeek辅助完成</span>
        </div>
    </div>

    <!-- ===== 模态框 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <button class="modal-close" id="modalCloseBtn">✕</button>
            <div id="modalIconContainer" style="text-align:center; margin-bottom:4px;"></div>
            <div class="modal-name" id="modalName">向日葵</div>
            <div style="text-align:center;"><span class="modal-type" id="modalType">🌱 植物</span></div>
            <div class="modal-desc" id="modalDesc">生产阳光，为你提供能量。</div>
            <div class="props" id="modalProps"></div>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. 内置数据
        // ================================================================
        const DEFAULT_DATA = {
            plants: [{
                id: 'sunflower',
                name: '向日葵',
                emoji: '🌱',
                image: 'common/plant/向日葵.png',
                cost: 50,
                health: 300,
                damage: 0,
                range: '无',
                recharge: '6秒',
                special: '生产',
                description: '最基本的阳光生产植物，每20秒生产25阳光，为你提供能量，在夜晚，生产的效率减半：每40秒25阳光。'
            }, {
                id: 'peashooter',
                name: '豌豆射手',
                emoji: '🌱',
                image: 'common/plant/豌豆射手.png',
                cost: 100,
                health: 300,
                damage: 20,
                range: '直线',
                recharge: '3秒',
                special: '远程',
                description: '最基础的攻击植物，向前方发射豌豆攻击僵尸，每3秒发射一颗豌豆，在第3.6秒击中僵尸，造成20点伤害。'
            }, {
                id: 'wallnut',
                name: '坚果墙',
                emoji: '🌱',
                image: 'common/plant/坚果.png',
                cost: 50,
                health: 3600,
                damage: 0,
                range: '无',
                recharge: '30秒',
                special: '防御',
                description: '坚果墙拥有3600点生命值，可作为屏障阻挡僵尸前进。血量在3600（满血）时为健康状态，在2400时为破损状态，在1200时为重度破损状态。'
            }, {
                id: 'potatomine',
                name: '土豆地雷',
                emoji: '🌱',
                image: 'common/plant/激活土豆地雷.png',
                cost: 25,
                health: 300,
                damage: 1800,
                range: '单格',
                recharge: '30秒',
                special: '灰烬',
                description: '土豆地雷需要准备15秒，出土后对本格僵尸造成1800点伤害。'
            }, {
                id: 'snowpea',
                name: '寒冰射手',
                emoji: '🌱',
                image: 'common/plant/寒冰射手.png',
                cost: 175,
                health: 300,
                damage: 20,
                range: '直线',
                recharge: '3秒',
                special: '远程 · 减速',
                description: '每3秒发射一颗寒冰豌豆，在第3.6秒对僵尸造成20点伤害并给予10秒减速。'
            }, {
                id: 'cherrybomb',
                name: '樱桃炸弹',
                emoji: '🌱',
                image: 'common/plant/樱桃炸弹.png',
                cost: 150,
                health: 300,
                damage: 1800,
                range: '3x3范围',
                recharge: '50秒',
                special: '灰烬',

        // ================================================================
        // 2. 状态
        // ================================================================
        let allData = null;
        let currentFilter = 'all';
        let searchQuery = '';

        // DOM 引用
        const grid = document.getElementById('gridContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const statsCounter = document.getElementById('statsCounter');
        const tabsContainer = document.getElementById('tabsContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalIconContainer = document.getElementById('modalIconContainer');
        const modalName = document.getElementById('modalName');
        const modalType = document.getElementById('modalType');
        const modalDesc = document.getElementById('modalDesc');
        const modalProps = document.getElementById('modalProps');
        const toast = document.getElementById('toast');
        const countAll = document.getElementById('countAll');
        const countPlant = document.getElementById('countPlant');
        const countZombie = document.getElementById('countZombie');
        const countGuide = document.getElementById('gameGuide');

        // ================================================================
        // 3. 工具函数
        // ================================================================
        function showToast(message, type = 'info', duration = 3000) {
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.remove('show'); }, duration);
        }

        function getTypeLabel(type) {
            if (type === 'plant') return '🌱 植物';
            if (type === 'zombie') return '🧟 僵尸';
            return '📰 资讯';
        }

        function getTagClass(type) {
            return type === 'plant' ? 'plant-tag' : 'zombie-tag';
        }

        function flattenData(data) {
            if (!data) return [];
            const plants = (data.plants || []).map(item => ({ ...item, type: 'plant' }));
            const zombies = (data.zombies || []).map(item => ({ ...item, type: 'zombie' }));
            const guides = (data.guides || []).map(item => ({ ...item, type: 'guide' }));
            return [...plants, ...zombies, ...guides];
        }

        function filterItems(items, filter, query) {
    let result = items;
    if (filter === 'all') {
        result = result.filter(i => i.type === 'plant' || i.type === 'zombie');
    } else if (filter === 'plant') {
        result = result.filter(i => i.type === 'plant');
    } else if (filter === 'zombie') {
        result = result.filter(i => i.type === 'zombie');
    } else if (filter === 'guide') {
        result = result.filter(i => i.type === 'guide');
    }

    if (query.trim()) {
        const q = query.trim().toLowerCase();
        result = result.filter(i => {
            if (i.type === 'guide') {
                const title = (i.title || '').toLowerCase();
                const div = document.createElement('div');
                div.innerHTML = i.content || '';
                const textContent = div.textContent || '';
                return title.includes(q) || textContent.toLowerCase().includes(q);
            }
            return (i.name || '').toLowerCase().includes(q) ||
                   (i.special || '').toLowerCase().includes(q) ||
                   (i.description || '').toLowerCase().includes(q);
        });
    }
    return result;
}

        function renderCardIcon(item) {
            if (item.image && item.image.trim() !== '') {
                return `<img src="${item.image}" alt="${item.name}" class="card-img" onerror="this.style.display='none'; this.parentNode.innerHTML='<span class=\\'card-emoji\\'>${item.emoji || '🌿'}</span>';">`;
            } else {
                return `<span class="card-emoji">${item.emoji || '🌿'}</span>`;
            }
        }

        // ================================================================
        // 4. 模态框（通用，支持 guide）
        // ================================================================
        function openModal(item, type) {
            if (type === 'guide') {
                // 资讯专用模态框
                modalIconContainer.innerHTML = ''; // 无图标
                modalName.textContent = item.title;
                modalType.textContent = `📅 ${item.date}`;
                modalType.style.background = '#f0f7eb';
                modalDesc.innerHTML = item.content || '暂无内容';
                modalDesc.style.borderLeftColor = '#8aaa7a';
                let linkHtml = '';
                if (item.link) {
                    linkHtml = `<div style="margin-top:16px;text-align:center;">
                        <a href="${item.link}" target="_blank" class="btn" style="background:#4d7c3f;color:#fff;padding:10px 24px;border-radius:40px;text-decoration:none;display:inline-block;">🔗 阅读原文</a>
                    </div>`;
                }
                modalProps.innerHTML = linkHtml;
                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
                return;
            }

            // 植物 / 僵尸 原有逻辑
            const isPlant = type === 'plant';
            if (item.image && item.image.trim() !== '') {
                modalIconContainer.innerHTML =
                    `<img src="${item.image}" alt="${item.name}" class="modal-img" onerror="this.style.display='none'; this.parentNode.innerHTML='<span class=\\'modal-emoji\\'>${item.emoji || '🌿'}</span>';">`;
            } else {
                modalIconContainer.innerHTML = `<span class="modal-emoji">${item.emoji || '🌿'}</span>`;
            }

            modalName.textContent = item.name;
            modalType.textContent = getTypeLabel(type);
            modalType.style.background = isPlant ? '#e1f0d8' : '#efe6e6';
            modalDesc.textContent = item.description || '暂无描述';
            modalDesc.style.borderLeftColor = '#8aaa7a';

            let propsHtml = '';
            if (isPlant) {
                const fields = [
                    ['☀️ 阳光消耗', item.cost],
                    ['❤️ 生命值', item.health],
                    ['⚔️ 伤害', item.damage],
                    ['📏 攻击范围', item.range || '无'],
                    ['⏱️ 冷却速度', item.recharge || '中等'],
                    ['✨ 能力', item.special || '无']
                ];
                fields.forEach(([label, value]) => {
                    propsHtml +=
                        `<div class="prop-item"><span class="label">${label}</span><span class="value plant-val">${value}</span></div>`;
                });
            } else {
                const fields = [
                    ['❤️ 生命值', item.health],
                    ['💨 速度', item.speed || '普通'],
                    ['⚔️ 伤害', item.damage || 50],
                    ['✨ 能力', item.special || '无']
                ];
                fields.forEach(([label, value]) => {
                    propsHtml +=
                        `<div class="prop-item"><span class="label">${label}</span><span class="value zombie-val">${value}</span></div>`;
                });
            }
            modalProps.innerHTML = propsHtml;

            modalOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
        modalCloseBtn.addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        // ================================================================
        // 5. 渲染
        // ================================================================
        function render() {
            if (!allData) {
                grid.innerHTML = `<div class="empty-state"><span class="big-emoji">📂</span><h3>数据加载失败</h3><p>请刷新页面重试</p></div>`;
                statsCounter.textContent = '0 个条目';
                countAll.textContent = '0';
                countPlant.textContent = '0';
                countZombie.textContent = '0';
                countGuide.textContent = '0';
                return;
            }

            const flat = flattenData(allData);
            const filtered = filterItems(flat, currentFilter, searchQuery);

            // 更新统计
            statsCounter.textContent = filtered.length + ' 个条目';
            const allItems = flat.filter(i => i.type === 'plant' || i.type === 'zombie');  // 只统计植物+僵尸
            const plantItems = flat.filter(i => i.type === 'plant');
            const zombieItems = flat.filter(i => i.type === 'zombie');
            const guideItems = flat.filter(i => i.type === 'guide');
            countAll.textContent = allItems.length;
            countPlant.textContent = plantItems.length;
            countZombie.textContent = zombieItems.length;
            countGuide.textContent = guideItems.length;

            // 激活 tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === currentFilter);
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <span class="big-emoji">🔍</span>
                        <h3>没有找到匹配的条目</h3>
                        <p>试试调整搜索关键词或切换分类</p>
                    </div>
                `;
                return;
            }

            // ---- 根据类型渲染 ----
            if (currentFilter === 'guide') {
                // 渲染帖子列表
                grid.style.display = 'block'; // 改为 block 以便帖子上下排列
                grid.innerHTML = filtered.map(item => `
                    <div class="post-card" data-id="${item.id}" data-type="guide">
                        <div class="post-header">
                            <h3 class="post-title">${item.title}</h3>
                            <span class="post-date">📅 ${item.date}</span>
                        </div>
                        <div class="post-content">${item.content}</div>
                        ${item.link ? `<a href="${item.link}" target="_blank" class="post-link">🔗 阅读原文</a>` : ''}
                    </div>
                `).join('');

                // 绑定点击事件（点击整个卡片打开详情）
                grid.querySelectorAll('.post-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        // 如果点击的是内部的链接，不触发卡片点击，避免冲突
                        if (e.target.tagName === 'A') return;
                        const id = card.dataset.id;
                        const item = allData.guides.find(d => d.id === id);
                        if (item) openModal(item, 'guide');
                    });
                });
            } else {
                // 渲染卡片网格（植物 / 僵尸）
                grid.style.display = 'grid';
                grid.innerHTML = filtered.map(item => {
                    const tagLabel = item.type === 'plant' ? '🌱 植物' : '🧟 僵尸';
                    const tagClass = getTagClass(item.type);
                    const costOrHealth = item.type === 'plant' ? `☀️ ${item.cost}` : `❤️ ${item.health}`;
                    const extra = item.type === 'plant' ? (item.damage > 0 ? `⚔️ ${item.damage}` : '🌿 辅助') :
                        `💨 ${item.speed}`;
                    return `
                        <div class="card" data-id="${item.id}" data-type="${item.type}">
                            ${renderCardIcon(item)}
                            <div class="name">${item.name}</div>
                            <div class="sub">${costOrHealth} · ${extra}</div>
                            <div class="tags">
                                <span class="tag ${tagClass}">${tagLabel}</span>
                                ${item.special ? `<span class="tag">✨ ${item.special}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                // 绑定卡片点击
                grid.querySelectorAll('.card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = card.dataset.id;
                        const type = card.dataset.type;
                        const dataArray = type === 'plant' ? allData.plants : allData.zombies;
                        const item = dataArray.find(d => d.id === id);
                        if (item) openModal(item, type);
                    });
                });
            }
        }

        // ================================================================
        // 6. 初始化数据
        // ================================================================
        function initData() {
            allData = {
                plants: DEFAULT_DATA.plants.map(p => ({ ...p })),
                zombies: DEFAULT_DATA.zombies.map(z => ({ ...z })),
                guides: DEFAULT_DATA.guides.map(g => ({ ...g }))
            };
            render();
            showToast('✅ 数据加载成功', 'success', 2000);
        }

        // ================================================================
        // 7. 事件绑定
        // ================================================================
        tabsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;
            const filter = btn.dataset.filter;
            if (filter === currentFilter) return;
            currentFilter = filter;
            render();
        });

        function doSearch() {
            searchQuery = searchInput.value;
            render();
        }
        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
        searchInput.addEventListener('input', () => {
            clearTimeout(searchInput._timer);
            searchInput._timer = setTimeout(doSearch, 300);
        });

        // ================================================================
        // 8. 启动
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            initData();
            console.log('🌱 植物大战僵尸图鉴已启动（内置数据）');
        });
    </script>
